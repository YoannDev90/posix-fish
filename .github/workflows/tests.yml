name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Check formatting
        run: |
          fish_indent --check functions/*.fish tests/*.fish

      - name: Run test suite
        run: fish tests/run.fish
